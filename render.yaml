services:
  - type: web
    name: water-quality-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # User must set this in the dashboard
      - key: MONGO_DB_NAME
        sync: false # User must set this in the dashboard
